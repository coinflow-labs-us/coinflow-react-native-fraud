apply plugin: 'com.android.library'
apply plugin: 'org.jetbrains.kotlin.android'

def safeExtGet(prop, fallback) {
    rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
}

def nativeSdkVersion = new groovy.json.JsonSlurper()
    .parse(file('../package.json'))
    .nativeSdkVersions
    .android

android {
    namespace 'cash.coinflow.fraud.reactnative'
    compileSdkVersion safeExtGet('compileSdkVersion', 35)

    defaultConfig {
        minSdkVersion safeExtGet('minSdkVersion', 24)
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

// Apps that centralize repositories in settings.gradle apply the cash.coinflow.fraud.repositories settings
// plugin, which supplies every repository. A repository declared here would fail their build under
// FAIL_ON_PROJECT_REPOS, so declare none.
if (!gradle.ext.has('cash.coinflow.fraud.repositories')) {
    repositories {
        google()
        mavenCentral()
    }

    // Some of the native SDK's signal SDKs are served outside Maven Central. The app resolves this
    // module's transitive deps with its own repositories, so they have to be visible project-wide. Each
    // serves only its signal SDK's group, so the app's other dependencies are never requested from it.
    def signalRepositories = [
        'https://jitpack.io': 'com.github.nsure-ai',
        'https://maven.fpregistry.io/releases': 'com.fingerprint.android',
        'https://us-central1-maven.pkg.dev/verisoul/android': 'ai.verisoul',
    ]
    rootProject.allprojects {
        repositories {
            signalRepositories.each { repositoryUrl, signalGroup ->
                // Expo's config plugin already writes these into the app's allprojects block, and a
                // second exclusiveContent for the same group excludes it from both, so nothing serves it.
                def declared = withType(MavenArtifactRepository).any {
                    it.url.toString().replaceAll('/$', '') == repositoryUrl
                }
                if (declared) return
                exclusiveContent {
                    forRepository { maven { url repositoryUrl } }
                    filter { includeGroup signalGroup }
                }
            }
        }
    }
}

dependencies {
    implementation 'com.facebook.react:react-native:+'
    implementation "cash.coinflow:coinflow-fraud:${nativeSdkVersion}"
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
}
