apply plugin: 'com.android.library'
apply plugin: 'org.jetbrains.kotlin.android'

def safeExtGet(prop, fallback) {
    rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
}

def nativeSdkVersion = new groovy.json.JsonSlurper()
    .parse(file('../package.json'))
    .nativeSdkVersions
    .android

android {
    namespace 'cash.coinflow.fraud.reactnative'
    compileSdkVersion safeExtGet('compileSdkVersion', 35)

    defaultConfig {
        minSdkVersion safeExtGet('minSdkVersion', 24)
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

repositories {
    google()
    mavenCentral()
}

// Some of the native SDK's signal SDKs are served outside Maven Central. The app resolves this module's
// transitive deps with its own repositories, so they have to be visible project-wide.
rootProject.allprojects {
    repositories {
        maven { url 'https://jitpack.io' }
        maven { url 'https://maven.fpregistry.io/releases' }
        maven { url 'https://us-central1-maven.pkg.dev/verisoul/android' }
    }
}

dependencies {
    implementation 'com.facebook.react:react-native:+'
    implementation "cash.coinflow:coinflow-fraud:${nativeSdkVersion}"
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
}
